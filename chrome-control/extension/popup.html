<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Chrome 网页控制</title>
<link rel="stylesheet" href="popup.css">
<header>
  <img src="icons/tab-pointer-48.png" alt="" width="34" height="34">
  <h1>网页控制</h1>
  <span id="connection" role="status" data-state="pending">连接中</span>
</header>
<main>
  <div id="connection-issue" class="issue" hidden>
    <p id="connection-detail"></p>
    <button type="button" id="retry" hidden>重新连接</button>
  </div>
  <div id="site-access" hidden>
    <button type="button" id="toggle" class="site-row" role="switch" aria-checked="false"
            aria-label="允许此网站" aria-describedby="origin" disabled>
      <span class="site-info"><span class="caption">当前网站</span><bdi id="origin" dir="ltr"></bdi></span>
      <span class="switch" aria-hidden="true"></span>
    </button>
  </div>
  <label class="row global"><span>默认允许所有网站</span><input class="switch" type="checkbox" role="switch" id="all-sites" disabled></label>
  <p id="scope" class="message" role="status"></p>
  <div id="file-issue" class="issue" hidden>
    <p>要操作此文件，请开启「允许访问文件网址」。</p>
    <button type="button" id="file-settings">扩展详情</button>
  </div>
</main>
<script type="module" src="popup.mjs"></script>
</html>
